name: SEO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore data-cache JSONs
        # Mirrors ci.yml — keep the data-cache prefetch in sync. Building the
        # site without these JSONs would fall back to GraphQL calls, which is
        # not allowed on PR runs.
        run: |
          set -e
          if git fetch origin data-cache --depth 1 2>/dev/null; then
            mkdir -p src/data
            git show origin/data-cache:src/data/github-activity.json \
              > src/data/github-activity.json 2>/dev/null || true
            git show origin/data-cache:src/data/project-stats.json \
              > src/data/project-stats.json 2>/dev/null || true
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Provide Chrome for puppeteer
        # `make build` bakes the PDF via puppeteer (generate-pdf.mjs), but the
        # runner image ships a broken ~/.cache/puppeteer (version folder
        # without the executable) and `npx puppeteer browsers install chrome`
        # exits 0 without installing anything. Prefer the image's preinstalled
        # Chrome; fall back to a clean puppeteer download. The --version call
        # fails the job loudly if neither path yields a working binary.
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          if [ -z "$BIN" ] || ! "$BIN" --version; then
            rm -rf "$HOME/.cache/puppeteer/chrome"
            npx puppeteer browsers install chrome
            BIN="$(node -e 'process.stdout.write(require("puppeteer").executablePath())')"
          fi
          "$BIN" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$BIN" >> "$GITHUB_ENV"
      - run: make build
      - run: make check-seo
