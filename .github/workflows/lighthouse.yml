name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_STATS_TOKEN: ${{ secrets.PROJECT_STATS_TOKEN }}
      - name: Provide Chrome for puppeteer
        # `make build` bakes the PDF via puppeteer (generate-pdf.mjs), but the
        # runner image ships a broken ~/.cache/puppeteer (version folder
        # without the executable) and `npx puppeteer browsers install chrome`
        # exits 0 without installing anything. Prefer the image's preinstalled
        # Chrome; fall back to a clean puppeteer download. The --version call
        # fails the job loudly if neither path yields a working binary.
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          if [ -z "$BIN" ] || ! "$BIN" --version; then
            rm -rf "$HOME/.cache/puppeteer/chrome"
            npx puppeteer browsers install chrome
            BIN="$(node -e 'process.stdout.write(require("puppeteer").executablePath())')"
          fi
          "$BIN" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$BIN" >> "$GITHUB_ENV"
      - run: make build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_STATS_TOKEN: ${{ secrets.PROJECT_STATS_TOKEN }}
      # Reuse Playwright's Chromium so Lighthouse has a real browser on
      # the runner. `chrome-launcher` (used by lhci) honours CHROME_PATH.
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          CHROME_PATH="$(node -e 'const p=require("@playwright/test").chromium.executablePath(); process.stdout.write(p)')"
          export CHROME_PATH
          npm run lighthouse
