name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_STATS_TOKEN: ${{ secrets.PROJECT_STATS_TOKEN }}
      - name: Install puppeteer Chrome
        # The runner image ships a partial ~/.cache/puppeteer (the version
        # folder exists without the chrome executable), which makes both the
        # `npm ci` postinstall download and a plain install skip or fail.
        # Clear it and install the pinned Chrome that `make build` needs to
        # bake the PDF (generate-pdf.mjs).
        run: |
          rm -rf "$HOME/.cache/puppeteer/chrome"
          npx puppeteer browsers install chrome
      - run: make build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_STATS_TOKEN: ${{ secrets.PROJECT_STATS_TOKEN }}
      # Reuse Playwright's Chromium so Lighthouse has a real browser on
      # the runner. `chrome-launcher` (used by lhci) honours CHROME_PATH.
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          CHROME_PATH="$(node -e 'const p=require("@playwright/test").chromium.executablePath(); process.stdout.write(p)')"
          export CHROME_PATH
          npm run lighthouse
