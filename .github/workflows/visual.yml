name: Visual

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Provide Chrome for puppeteer
        # `make build` bakes the PDF via puppeteer (generate-pdf.mjs), but the
        # runner image ships a broken ~/.cache/puppeteer (version folder
        # without the executable) and `npx puppeteer browsers install chrome`
        # exits 0 without installing anything. Prefer the image's preinstalled
        # Chrome; fall back to a clean puppeteer download. The --version call
        # fails the job loudly if neither path yields a working binary.
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          if [ -z "$BIN" ] || ! "$BIN" --version; then
            rm -rf "$HOME/.cache/puppeteer/chrome"
            npx puppeteer browsers install chrome
            BIN="$(node -e 'process.stdout.write(require("puppeteer").executablePath())')"
          fi
          "$BIN" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$BIN" >> "$GITHUB_ENV"
      # Build without GitHub tokens so generate-github-activity and
      # generate-project-stats fall back to their committed `enabled: false`
      # caches. With tokens present they refetch live data, which makes the
      # projects section sort order and active-state classes drift between
      # runs and against locally recorded baselines. Visual regression tests
      # the UI structure; stats freshness is exercised by Pages on deploy.
      - run: make build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
